<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestruni cursos</title>
    <link rel="stylesheet" href="../public/css/bootstrap.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
</head>

<body>
    <header>
        <!--navbar-expand-xl -> decide cuándo cambia el menú en función del tamaño xl (1200px bootstrap.min.css)-->
        <nav class="navbar navbar-expand-xl navbar-light bg-light shadow-sm " id="custom-navbar">
            <div class="container-fluid">
                <h1 class="navbar-brand mb-0">Gestruni</h1>
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Mostrar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav w-100 justify-content-center">
                        <li class="nav-item me-3"><a class="nav-link" href="./index.html">Inicio</a> </li>
                        <li class="nav-item me-3"><a class="nav-link" href="./cursos.html">Cursos</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="./detalles_cursos.html">Detalle_Cursos</a>
                        </li>
                        <li class="nav-item me-3"><a class="nav-link" href="./matriculas.html">Matriculas</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="./docentes.html">Docentes</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="./aulas.html">Aulas</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="./perfil.html">Perfil</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="./accesibilidad.html">Accesibilidad</a></li>
                        <li class="nav-item me-3"><a class="nav-link" href="./administracion.html">Administracion</a>
                        </li>
                        <li class="nav-item me-3"><a class="nav-link btn btn-warning btn-sm text-white"
                                href="./login.html">Login</a></li>
                        <li class="nav-item me-3"><a class="nav-link btn btn-danger btn-sm text-white"
                                href="./logout.html">Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>

    </header>

    <main class="container py-3">
        <!-- migas de pan -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="./index.html">Inicio</a>
                </li>
                <li class="breadcrumb-item active">
                    <a href="./cursos.html" aria-current="page">Cursos</a>
                </li>
            </ol>
        </nav>
        <!-- contenedor de los controles (título, añadir curso y buscador de cursos) -->
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
            <!-- título -->
            <h2 class="mb-0 me-auto">Cursos</h2>
            <!-- añdir curso -->
            <button id="boton-alta-curso" class="btn btn-success" type="button" data-bs-toggle="collapse"
                data-bs-target="#alta-curso"
                aria-controls="alta-curso" aria-expanded="false">
                Añadir curso
            </button>
            <!-- buscador de cursos -->
            <div class="d-flex" role="search">
                <label for="busqueda-cursos" class="visually-hidden">Buscar cursos</label>
                <input class="form-control me-2" type="search" id="busqueda-cursos" placeholder="Buscar cursos"
                    aria-label="Buscar cursos">
            </div>
        </div>

        <!-- Formulario de alta de cursos. -->
        <section id="alta-curso" class="collapse card mb-4" aria-labelledby="titulo-alta-curso">
            <div class="card-body">
                <h3 id="titulo-alta-curso" class="h4">Añadir curso</h3>
                <form id="alta-curso-form" class="row g-3" novalidate>
                    <div class="col-md-6">
                        <label for="curso-nombre" class="form-label">Nombre del curso *</label>
                        <input type="text" class="form-control" id="curso-nombre" maxlength="100" required>
                    </div>

                    <div class="col-md-3">
                        <label for="curso-docente" class="form-label">Docente *</label>
                        <select class="form-select" id="curso-docente" required>
                            <option value="">Selecciona un docente...</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="curso-aula" class="form-label">Aula *</label>
                        <select class="form-select" id="curso-aula" required>
                            <option value="">Selecciona un aula...</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="curso-descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="curso-descripcion" rows="2"></textarea>
                    </div>

                    <div class="col-md-3">
                        <label for="curso-fecha-inicio" class="form-label">Fecha de inicio *</label>
                        <input type="date" class="form-control" id="curso-fecha-inicio" required>
                    </div>

                    <div class="col-md-3">
                        <label for="curso-fecha-fin" class="form-label">Fecha de fin *</label>
                        <input type="date" class="form-control" id="curso-fecha-fin" required>
                    </div>

                    <div class="col-md-4">
                        <label for="curso-horario" class="form-label">Horario</label>
                        <input type="text" class="form-control" id="curso-horario" placeholder="Ej: Lunes y miércoles 17:00-19:00" maxlength="100">
                    </div>

                    <div class="col-md-2">
                        <label for="curso-plazas" class="form-label">Plazas *</label>
                        <input type="number" class="form-control" id="curso-plazas" min="1" required>
                    </div>

                    <div class="col-12">
                        <label for="curso-imagen" class="form-label">Ruta de imagen (opcional)</label>
                        <input type="text" class="form-control" id="curso-imagen" placeholder="img/cursos/curso01.png" maxlength="255">
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Guardar curso</button>
                    </div>
                </form>
            </div>
        </section>
        <!-- Los cursos se generan con JavaScript. -->
        <section id="catalogo-cursos" class="row g-4 mt-2" aria-live="polite">
            <!-- Las tarjetas se generan con JavaScript. -->
        </section>

        <!-- Ventana de confirmación reutilizada para cualquier curso. Sujeto a cambios.-->
        <div class="modal fade" id="confirmar-eliminacion" tabindex="-1" aria-labelledby="titulo-confirmar-eliminacion"
            aria-hidden="true">
            <div class="modal-dialog modal-sm">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="titulo-confirmar-eliminacion" class="modal-title h5">
                            Confirmar eliminación
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <p id="mensaje-confirmar-eliminacion" class="mb-0"></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="mantener-curso" class="btn btn-light"
                            data-bs-dismiss="modal">Mantener</button>
                        <button type="button" id="borrar-curso" class="btn btn-danger">
                            Borrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="../public/js/bootstrap.bundle.min.js"></script>
    <script src="../public/js/cursos.js"></script>
</body>

</html>

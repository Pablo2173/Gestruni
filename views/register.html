<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestruni - Registro</title>
    <link rel="stylesheet" href="../public/css/bootstrap.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
</head>

<body class="pagina-registro">
    <main class="container">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="./index.html">Inicio</a>
                </li>
                <li class="breadcrumb-item">
                    <a href="./login.html">Login</a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">Registro</li>
            </ol>
        </nav>

        <!-- Formulario de registro -->
        <section class="registro-card mx-auto" aria-labelledby="titulo-registro">
            <h1 id="titulo-registro" class="h2 mb-4">Crear una cuenta</h1>

            <!-- registro-from -> identificación del formulario de registro para js -->
            <!-- novalidate -> desactiva la validación automática del navegador para realizarla desde js -->
            <form id="registro-form" novalidate>
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name" minlength="2"
                        required>

                    <!-- invalid-feedback -> mensaje de error que se muestra cuando la validación falla -->
                    <div class="invalid-feedback" id="nombre-error">Escribe tu nombre (al menos 2 caracteres).</div>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" autocomplete="email" required>
                    <div class="invalid-feedback" id="correo-error">Introduce un correo electrónico válido.</div>
                </div>

                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" name="contrasena"
                        autocomplete="new-password" minlength="8" required>
                    <div class="form-text">Debe tener al menos 8 caracteres.</div>
                    <div class="invalid-feedback" id="contrasena-error">La contraseña debe tener al menos 8 caracteres.</div>
                </div>

                <div class="mb-4">
                    <label for="confirmacion-contrasena" class="form-label">Confirmación de contraseña</label>
                    <input type="password" class="form-control" id="confirmacion-contrasena"
                        name="confirmacion-contrasena" autocomplete="new-password" minlength="8" required>
                    <div class="invalid-feedback" id="confirmacion-contrasena-error">Las contraseñas deben coincidir.</div>
                </div>

                <button type="submit" class="btn btn-success">Registrarme</button>
                <p id="registro-mensaje" class="mt-3 mb-0" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <!-- Incluye el script de validación de registro -->
    <script src="../public/js/register.js"></script>
</body>

</html>
